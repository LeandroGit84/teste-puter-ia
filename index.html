<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Trufas Premium</title>

    <link rel="stylesheet" href="./css/style.css" />

    <!-- Puter AI -->
    <script src="https://js.puter.com/v2/"></script>
  </head>

  <body>
    <main class="chat">
      <header class="chat-header">
        <div class="logo">🍫</div>

        <div>
          <h1>Trufas Premium</h1>
          <span>Assistente virtual</span>
        </div>
      </header>

      <section id="chat" class="chat-messages">
        <!-- As mensagens serão inseridas pelo JavaScript -->
      </section>

      <form id="form-chat" class="chat-input">
        <input
          id="mensagem"
          type="text"
          placeholder="Digite sua mensagem..."
          autocomplete="off"
        />

        <button type="submit">Enviar</button>
      </form>

      <!-- CARRINHO -->
      <div class="carrinho">
        <button id="btn-carrinho" class="btn-carrinho">
          🛒
          <span id="contador-carrinho">0</span>
        </button>

        <div id="painel-carrinho" class="painel-carrinho">
          <div class="carrinho-header">
            <h2>Seu pedido</h2>

            <button id="fechar-carrinho">✕</button>
          </div>

          <div id="lista-carrinho" class="lista-carrinho">
            <!-- Produtos serão inseridos pelo JavaScript -->
          </div>

          <div class="carrinho-footer">
            <div class="carrinho-total">
              <span>Total</span>
              <strong id="total-carrinho"> R$ 0,00 </strong>
            </div>

            <button id="finalizar-pedido" class="btn-finalizar">
              Finalizar pedido
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="./js/produtos.js"></script>
    <script src="./js/ia.js"></script>
  </body>
</html>
